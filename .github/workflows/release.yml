name: Release mlx-agent

# Tag-driven release: push `mlx-agent-vX.Y.Z` (or any v* tag) to build all
# targets and attach `mlx-agent-<tag>-<platform>-<arch>.tar.gz` assets.
# The mlx-node CLI downloads `macos`/`linux-musl` assets by that name; the
# `windows` assets are published for future downloader support.
on:
  push:
    tags:
      - "v*"
      - "mlx-agent-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset_platform }}-${{ matrix.asset_arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - os: macos-14
            target: aarch64-apple-darwin
            asset_platform: macos
            asset_arch: aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset_platform: macos
            asset_arch: x86_64
          # Linux musl only — the static musl build runs on gnu and musl
          # hosts alike, so the gnu matrix slots are unnecessary.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_platform: linux-musl
            asset_arch: x86_64
            musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset_platform: linux-musl
            asset_arch: aarch64
            musl: true
          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_platform: windows
            asset_arch: x86_64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset_platform: windows
            asset_arch: aarch64

    env:
      # Build scripts (rg/fd/bfs/ugrep vendoring) download release tarballs.
      GROK_RELEASE_BUILD: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"
          targets: ${{ matrix.target }}

      # The action queries the GitHub release API for the protoc zip; the token
      # avoids anonymous-rate-limit flakes on shared runner IPs.
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # musl targets need musl-gcc for the linker and for aws-lc-rs's C shim.
      # Each musl job runs on a same-arch runner, so musl-gcc is a native compiler.
      - name: Install musl toolchain
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev cmake clang

      # -D_GNU_SOURCE exposes u_int*_t in musl headers; sqlite-vec.c needs them.
      - name: Set musl linker (x86_64)
        if: matrix.musl && matrix.asset_arch == 'x86_64'
        run: |
          {
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc"
            echo "CC_x86_64_unknown_linux_musl=musl-gcc"
            echo "CFLAGS_x86_64_unknown_linux_musl=-D_GNU_SOURCE -Du_int8_t=uint8_t -Du_int16_t=uint16_t -Du_int32_t=uint32_t -Du_int64_t=uint64_t"
          } >> "$GITHUB_ENV"

      - name: Set musl linker (aarch64)
        if: matrix.musl && matrix.asset_arch == 'aarch64'
        run: |
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc"
            echo "CC_aarch64_unknown_linux_musl=musl-gcc"
            echo "CFLAGS_aarch64_unknown_linux_musl=-D_GNU_SOURCE -Du_int8_t=uint8_t -Du_int16_t=uint16_t -Du_int32_t=uint32_t -Du_int64_t=uint64_t"
          } >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}

      - name: Build mlx-agent
        run: cargo build --release --locked -p xai-grok-pager-bin --target ${{ matrix.target }}

      - name: Package tarball (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -czf "dist/mlx-agent-${{ github.ref_name }}-${{ matrix.asset_platform }}-${{ matrix.asset_arch }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" mlx-agent

      - name: Package tarball (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/mlx-agent-${{ github.ref_name }}-${{ matrix.asset_platform }}-${{ matrix.asset_arch }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" mlx-agent.exe

      - uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.asset_platform }}-${{ matrix.asset_arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: asset-*
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -la dist/

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "mlx-agent ${{ github.ref_name }}" \
            --generate-notes \
            dist/*.tar.gz
